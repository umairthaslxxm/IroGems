<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - IRO GEMS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="feedback.css"> <!-- Reusing form styles -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="auth-state.js"></script>
    <script type="module" src="auth.js"></script>
</head>

<body>
    <nav>
        <a href="index.html">
            <img src="Assets/LogoNew1.png" alt="logo" class="logo" />
        </a>
        <ul>
            <li><a class="nav-item" href="index.html">Home</a></li>
            <li><a class="nav-item" href="gallery.html">Gallery</a></li>
            <li><a class="nav-item" href="shop.html">Shop</a></li>
            <li><a class="nav-item" href="feedback.html">Feedback</a></li>
        </ul>
    </nav>

    <main>
        <h1>Sign Up</h1>
        <form id="signup-form" class="feedback-form">
            <div class="input-container">
                <label for="firstName">First Name <span class="red">*</span></label>
                <input id="firstName" type="text" required placeholder="Enter First Name">
            </div>
            <div class="input-container">
                <label for="lastName">Last Name <span class="red">*</span></label>
                <input id="lastName" type="text" required placeholder="Enter Last Name">
            </div>

            <div class="input-container">
                <label for="accountName">Account Name <span class="red">*</span></label>
                <input id="accountName" type="text" required placeholder="Enter Account Name">
            </div>

            <div class="input-container">
                <label for="mobile">Mobile Number <span class="red">*</span></label>
                <input id="mobile" type="tel" required placeholder="Enter Mobile Number">
            </div>

            <div class="input-container">
                <label for="signup-email">Email <span class="red">*</span></label>
                <input id="signup-email" type="email" required placeholder="Enter your email">
            </div>

            <div class="input-container">
                <label for="signup-password">Password <span class="red">*</span></label>
                <input id="signup-password" type="password" required placeholder="Enter your password (min 6 chars)">
            </div>

            <div class="button-container">
                <button class="button" type="submit">Sign Up</button>
            </div>

            <p style="margin-top: 20px; font-size: 16px; text-align: center;">
                Already have an account? <a href="login.html" style="color: var(--primary);">Login</a>
            </p>
        </form>
    </main>

    <div class="pagefooter">
        <p>&copy; 2025 IRO GEMS. All rights reserved.</p>
    </div>
</body>

</html>
